# OBS診断ちゃんの判定の基準
#
# 各社の案内が変わったときは、このファイルだけを直す。
# 数値は 2026-11-10 に各社の公式の案内で確かめた値。
#
# [<配信先>] の節のキー
#   name                         表示名
#   checked                      基準を確かめた日付
#   url                          基準にした案内の URL
#   max_height                   短辺の上限 (px)。0 は指定なし
#   max_fps                      FPS の上限。0 は指定なし
#   fps_allowed                  使ってよい FPS の一覧。空は指定なし
#   video_bitrate_max            映像のビットレートの上限 (kbps)。0 は指定なし
#   keyint_min / keyint_max      キーフレームの間隔の範囲 (秒)
#   keyint_recommended           キーフレームの間隔の推奨 (秒)
#   profiles                     H.264 のプロファイルの一覧。空は指定なし
#   audio_sample_rates           音声のサンプルレートの一覧 (Hz)。空は指定なし
#   audio_surround_sample_rate   サラウンドのときのサンプルレート (Hz)。0 は指定なし
#   audio_surround_allowed       サラウンドを使ってよいか (true / false)
#   audio_stereo_bitrate_min     ステレオの音声のビットレートの下限 (kbps)。0 は指定なし
#   audio_surround_bitrate_min   サラウンドの音声のビットレートの下限 (kbps)。0 は指定なし
#   audio_bitrate_max            音声のビットレートの上限 (kbps)。0 は指定なし
#   audio_bitrate_recommended    音声のビットレートの推奨 (kbps)。0 は指定なし
#   multitrack_auto              Enhanced Broadcasting のとき映像の設定がサーバーで決まるか
#
# [<配信先>.video] の節の行
#   <短辺 px> <FPS の区分 30|60> <コーデック h264|hevc_av1|any> <最小 kbps> <推奨 kbps>
#   FPS の区分は、30.5 を超える FPS を 60、それ以下を 30 として引く。最小の 0 は指定なし。

[youtube]
name = YouTube Live
checked = 2026-11-10
url = https://support.google.com/youtube/answer/2853702
max_height = 2160
max_fps = 60
fps_allowed =
video_bitrate_max = 0
keyint_min = 1
keyint_max = 4
keyint_recommended = 2
profiles =
audio_sample_rates = 44100,48000
audio_surround_sample_rate = 48000
audio_surround_allowed = true
audio_stereo_bitrate_min = 128
audio_surround_bitrate_min = 384
audio_bitrate_max = 0
audio_bitrate_recommended = 128
multitrack_auto = false

[youtube.video]
2160 60 h264 14000 50000
