<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">OBS Shindan-chan</title>
  <desc id="description">A clipboard checklist with three rows marked ok, ok and warning, standing for the diagnosis result.</desc>
  <rect x="12" y="12" width="232" height="232" rx="24" fill="#141414"/>
  <!-- Clipboard -->
  <rect x="56" y="48" width="144" height="172" rx="16" fill="none" stroke="#EEEEEE" stroke-width="8"/>
  <rect x="96" y="36" width="64" height="26" rx="10" fill="#EEEEEE"/>
  <!-- Row 1: ok -->
  <path d="M76 98 l10 10 l18 -20" fill="none" stroke="#3CC8B4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="118" y="92" width="62" height="12" rx="6" fill="#EEEEEE"/>
  <!-- Row 2: ok -->
  <path d="M76 140 l10 10 l18 -20" fill="none" stroke="#3CC8B4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="118" y="134" width="62" height="12" rx="6" fill="#EEEEEE"/>
  <!-- Row 3: warning -->
  <circle cx="90" cy="184" r="14" fill="#F4A340"/>
  <rect x="87" y="174" width="6" height="12" rx="3" fill="#141414"/>
  <circle cx="90" cy="192" r="3.2" fill="#141414"/>
  <rect x="118" y="178" width="44" height="12" rx="6" fill="#EEEEEE"/>
</svg>
